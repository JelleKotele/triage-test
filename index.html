<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    .card { border: 1px solid #ccc; border-radius: .5rem; padding: .75rem 1rem; margin-top: 1rem; }
    .card h2 { margin: 0 0 .5rem; font-size: 1rem; }
    .hidden { display: none; }
    .error { color: #a00; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <div id="ready" class="card hidden" aria-live="polite">
    <h2>Тема: <span id="topic"></span></h2>
    <p><strong>Черновик ответа:</strong></p>
    <p id="draft"></p>
  </div>

  <div id="manual" class="card hidden error" aria-live="polite">
    Не удалось автоматически разобрать заявку. Проверьте текст вручную.
  </div>

  <div id="invalid" class="card hidden error" aria-live="polite">
    Введите непустой текст заявки.
  </div>

  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const boxReady = document.querySelector("#ready");
    const boxManual = document.querySelector("#manual");
    const boxInvalid = document.querySelector("#invalid");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");

    function reset() {
      boxReady.classList.add("hidden");
      boxManual.classList.add("hidden");
      boxInvalid.classList.add("hidden");
      topicEl.textContent = "";
      draftEl.textContent = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      reset();

      const reply = await fetch("/api/triage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: message.value }),
      });

      const data = await reply.json().catch(() => ({}));

      if (reply.status === 400) {
        boxInvalid.classList.remove("hidden");
        return;
      }
      if (data.status === "ready") {
        topicEl.textContent = data.topic;
        draftEl.textContent = data.draft;
        boxReady.classList.remove("hidden");
        return;
      }
      boxManual.classList.remove("hidden");
    });
  </script>
</body>
</html>
